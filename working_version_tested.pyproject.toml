[project]
name = "quick-excel-csv"
version = "0.1.0"
description = "qxc - browse and profile CSV, Excel and LibreOffice Calc files in the terminal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "odfpy>=1.4.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "textual-dev>=1.8.0",
    "xlrd>=2.0.2",
]

[project.scripts]
qxc = "qxc.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qxc"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
